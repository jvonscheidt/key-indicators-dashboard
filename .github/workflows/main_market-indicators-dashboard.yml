# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - market-indicators-dashboard

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Serialise deploys so two quick pushes can't overlap in Azure. A newer pending
# run replaces an older pending one; the running deploy is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Decides whether this run may deploy, and which commit.
  #  - workflow_run: the `branches` filter matches the triggering run's head
  #    branch, which a fork PR can also name `main`. Only accept green CI runs
  #    from a push to this repository.
  #  - workflow_dispatch: only from `main`, and only if CI passed for that commit.
  #  - Either way, skip commits that are no longer the tip of `main`, so a slow
  #    older run can't overwrite a newer deploy.
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read #Required to look up CI runs
      contents: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      sha: ${{ steps.check.outputs.sha }}

    steps:
      - name: Check commit is the green tip of main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$SHA" != "$tip" ]; then
            echo "::notice::$SHA is no longer the tip of main ($tip); skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --event push --commit "$SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            if [ "$conclusion" != "success" ]; then
              echo "::error::CI has not passed for $SHA (latest: ${conclusion:-no run}); refusing to deploy."
              exit 1
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up Python version
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v7
        with:
          name: python-app
          # Hidden files are dropped by default, which silently left out
          # .streamlit/config.toml. Include them, minus repo/tooling metadata.
          include-hidden-files: true
          path: |
            .
            !antenv/
            !.git/
            !.github/
            !.claude/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_754CD0433C6245AB94A2ADA2BFB26794 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D779D5429DB346A59ACD1A869E262E6D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_15B20744684144FC89DFC3777AE72FA1 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'market-indicators-dashboard'
          slot-name: 'Production'
          